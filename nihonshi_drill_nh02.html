<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>②中国の歴史書が伝える「倭国」の姿 ドリル｜日本史基礎GAMBA</title>
<style>
  body{font-family:"Meiryo",sans-serif;max-width:860px;margin:20px auto;background:#fdf5ec;font-size:16px;padding:0 16px 80px;line-height:1.8}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:#8b3322;color:#fff;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:bold;text-decoration:none;margin-bottom:14px}
  .back-link:hover{background:#6a2318}
  .unit-header{background:linear-gradient(135deg,#8b3322,#c87000);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:18px}
  .unit-header .unit-num{font-size:13px;opacity:0.85;margin-bottom:4px}
  .unit-header h1{font-size:20px;margin:0 0 10px;line-height:1.5}
  .stat-bar{display:flex;gap:8px;flex-wrap:wrap}
  .stat-chip{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:20px;padding:3px 13px;font-size:12px;font-weight:bold}
  .mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .mode-tab{padding:10px 22px;border:2px solid #d4956a;border-radius:22px;font-size:15px;font-weight:bold;cursor:pointer;background:#fff;color:#8b3322;transition:all 0.2s;flex:1;min-width:130px;text-align:center}
  .mode-tab.active{background:#8b3322;color:#fff;border-color:#8b3322;box-shadow:0 3px 0 #6a2318}
  .mode-tab:hover:not(.active){background:#fdebd0}
  .panel{background:#fff;border-radius:12px;border:1px solid #d4956a;padding:22px;margin-bottom:14px}
  .fc-progress{font-size:13px;color:#888;margin-bottom:8px;text-align:center}
  .fc-timer-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .fc-timer-btn{padding:6px 16px;border:2px solid #d4956a;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer;background:#fff;color:#8b3322;transition:all 0.15s}
  .fc-timer-btn.active{background:#8b3322;color:#fff;border-color:#8b3322}
  .fc-timer-btn:hover:not(.active){background:#fdebd0}
  .fc-card{background:linear-gradient(135deg,#fffbf0,#fde8c0);color:#1a1a2e;border:2px solid #f0c880;border-radius:18px;padding:36px 28px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;margin-bottom:14px;position:relative;box-shadow:0 4px 18px rgba(200,112,0,0.15);transition:background 0.3s,border-color 0.3s}
  .fc-card .fc-front{font-size:19px;line-height:1.8;font-weight:bold;color:#1a1a2e}
  .fc-card .fc-back{display:none;font-size:26px;font-weight:bold;color:#8b3322}
  .fc-card .fc-hint{font-size:13px;color:#6a4f00;margin-top:10px;display:none;background:rgba(255,255,255,0.6);border-radius:8px;padding:5px 12px}
  .fc-card.flipped{background:linear-gradient(135deg,#f0fff4,#d0f0d8);border-color:#6aab72}
  .fc-card.flipped .fc-front{display:none}
  .fc-card.flipped .fc-back{display:block}
  .fc-card.flipped .fc-hint{display:block}
  .fc-card .tap-hint{font-size:12px;color:#b08040;position:absolute;bottom:12px;right:16px}
  .fc-countdown{position:absolute;top:12px;right:16px;font-size:28px;font-weight:bold;color:#c87000;opacity:0.7;line-height:1;min-width:30px;text-align:center}
  .fc-btns{display:flex;gap:12px;margin-bottom:18px;justify-content:center}
  .fc-btn-ok{padding:11px 32px;background:#1a6b22;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #0d4f15}
  .fc-btn-ng{padding:11px 32px;background:#8b3322;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318}
  .fc-score-bar{background:#eee;border-radius:20px;height:12px;margin:10px 0;overflow:hidden}
  .fc-score-fill{height:100%;background:linear-gradient(90deg,#1a6b22,#2d8a30);border-radius:20px;transition:width 0.4s}
  .fc-result{background:#fff3e0;border:2px solid #d4956a;border-radius:12px;padding:20px;text-align:center;font-size:15px;display:none}
  .fc-restart{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:12px}
  .drill-q-num{font-size:12px;color:#888;margin-bottom:6px}
  .drill-q{font-size:17px;font-weight:bold;color:#1a1a2e;margin-bottom:14px;line-height:1.7}
  .drill-choices{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
  .drill-choice{padding:12px 16px;border-radius:9px;border:1.5px solid #d4956a;background:#fdf5ec;cursor:pointer;font-size:15px;line-height:1.6;transition:all 0.15s}
  .drill-choice:hover{border-color:#8b3322;background:#fdebd0}
  .drill-choice.correct{background:#d0f0d8;border-color:#1a6b22;color:#1a4015;pointer-events:none;font-weight:bold}
  .drill-choice.wrong{background:#fdd;border-color:#c00;color:#800;pointer-events:none}
  .drill-choice.reveal{background:#fdebd0;border-color:#c87000;pointer-events:none}
  .drill-exp{background:#1a1a2e;color:#f0f0f0;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.8;margin-bottom:12px;display:none}
  .drill-exp.show{display:block}
  .drill-exp .exp-ans{color:#f4d03f;font-weight:bold;display:block;margin-bottom:4px}
  .drill-next-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 26px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318;display:none}
  .drill-result{text-align:center;padding:28px;display:none}
  .drill-result-score{font-size:44px;font-weight:bold;color:#8b3322;margin-bottom:8px}
  .drill-result-msg{font-size:16px;color:#555;margin-bottom:18px}
  .drill-restart-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:15px;font-weight:bold;cursor:pointer}
  .drill-prog{font-size:13px;color:#888;text-align:right;margin-bottom:8px}
  .test-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .test-title{font-size:17px;font-weight:bold;color:#8b3322}
  .test-q-block{border-bottom:1px solid #eee;padding:16px 0}
  .test-q-block:last-child{border-bottom:none}
  .test-q{font-size:15px;font-weight:bold;color:#1a1a2e;margin-bottom:10px;line-height:1.7}
  .test-q-num{display:inline-block;background:#8b3322;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:13px;font-weight:bold;margin-right:8px}
  .test-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  @media(max-width:560px){.test-choices{grid-template-columns:1fr}}
  .test-choice{padding:9px 12px;border-radius:8px;border:1.5px solid #d4956a;background:#fdf5ec;cursor:pointer;font-size:14px;transition:all 0.15s}
  .test-choice:hover{border-color:#8b3322;background:#fdebd0}
  .test-choice.selected{border-color:#1a4f7a;background:#e0f0ff;color:#1a4f7a;font-weight:bold}
  .test-choice.correct{background:#d0f0d8;border-color:#1a6b22;color:#1a4015;font-weight:bold;pointer-events:none}
  .test-choice.wrong{background:#fdd;border-color:#c00;color:#800;pointer-events:none}
  .test-choice.reveal{background:#fdebd0;border-color:#c87000;pointer-events:none}
  .test-submit{background:#8b3322;color:#fff;border:none;border-radius:10px;padding:13px 36px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #6a2318;margin-top:18px;width:100%}
  .test-submit:hover{background:#6a2318}
  .test-result-wrap{display:none;text-align:center;padding:30px 0}
  .test-result-score{font-size:52px;font-weight:bold;color:#8b3322;line-height:1.2}
  .test-result-sub{font-size:16px;color:#555;margin:8px 0 18px}
  .test-badge{display:inline-block;background:linear-gradient(135deg,#c87000,#f4a261);color:#fff;border-radius:12px;padding:8px 20px;font-size:15px;font-weight:bold;margin-bottom:14px}
  .test-restart-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318}
  .test-review{margin-top:22px;text-align:left}
  .test-review-item{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:14px;line-height:1.7}
  .test-review-item.ok{background:#d0f0d8;border-left:4px solid #1a6b22}
  .test-review-item.ng{background:#fdd;border-left:4px solid #c00}
  .confetti-piece{position:fixed;top:-20px;border-radius:3px;animation:confettiFall linear forwards;z-index:9999;pointer-events:none}
  @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<a href="nihonshi_index.html" class="back-link">← 目次へ戻る</a>
<div class="unit-header">
  <div class="unit-num">第１章 原始・古代｜単元②</div>
  <h1>中国の歴史書が伝える「倭国」の姿</h1>
  <div class="stat-bar">
    <span class="stat-chip">🃏 フラッシュカード 9枚</span>
    <span class="stat-chip">✏️ 4択ドリル 5問</span>
    <span class="stat-chip">📋 確認テスト 8問</span>
  </div>
</div>
<div class="mode-tabs">
  <button class="mode-tab active" onclick="selectMode('flash')">🃏 フラッシュカード</button>
  <button class="mode-tab" onclick="selectMode('drill')">✏️ 4択ドリル</button>
  <button class="mode-tab" onclick="selectMode('test')">📋 確認テスト</button>
</div>
<div id="content-area"></div>
<script>
const UNIT = {
  flashCards: [{"q":"中国の歴史書が日本を指した名前は？","a":"倭","hint":"「漢委奴国王」の金印にも"},{"q":"2世紀後半，日本各地で起きた争乱を何という？","a":"倭国大乱","hint":"卑弥呼擁立のきっかけ"},{"q":"57年に奴国の王に金印を与えた後漢の皇帝は？","a":"光武帝","hint":"「漢委奴国王」と刻まれた"},{"q":"奴国の王が57年に授かった印章は？","a":"金印","hint":"1784年に志賀島で発見"},{"q":"呪術（鬼道）で邪馬台国を統治した女王は？","a":"卑弥呼","hint":"239年に魏に使者を送った"},{"q":"卑弥呼が治めた国は？","a":"邪馬台国","hint":"大和説・九州説が対立"},{"q":"239年に魏が卑弥呼に与えた称号は？","a":"親魏倭王","hint":"銅鏡100枚も下賜された"},{"q":"大和政権の大王が作った，鍵穴形の古墳は？","a":"前方後円墳","hint":"後円部が墓，前方部が祭礼"},{"q":"4〜5世紀，近畿地方を中心に成立した豪族の政治連合は？","a":"大和政権","hint":"大王を中心に全国を支配"}],
  drillQuiz:  [{"q":"紀元57年，後漢の光武帝から金印を授かったのはどの国の王ですか？","choices":["邪馬台国の卑弥呼","大和政権の大王","奴国の王","倭の五王"],"ans":2,"exp":"九州北部の奴国の王が金印「漢委奴国王」を授かりました。この金印は1784年に福岡県志賀島で発見されています。"},{"q":"2世紀後半，日本各地で起きた争乱を何といいますか？","choices":["大化の改新","壬申の乱","倭国大乱","承平の乱"],"ans":2,"exp":"倭国大乱は稲作の普及にともなう土地・食料争いが激化した内乱。その後，呪術的権威を持つ卑弥呼が女王として擁立されました。"},{"q":"239年，魏に使者を送り「親魏倭王」の称号を得た女王は誰ですか？","choices":["推古天皇","持統天皇","卑弥呼","神功皇后"],"ans":2,"exp":"卑弥呼は239年に魏へ使者を送り，「親魏倭王」の称号と銅鏡100枚などを授かりました。"},{"q":"大和政権が各地の支配を広げたことを示す，鍵穴形の古墳は何ですか？","choices":["円墳","方墳","前方後円墳","横穴式石室墳"],"ans":2,"exp":"前方後円墳は後円部が墓室，前方部が祭礼の場。この形の古墳が各地に広まったことが大和政権の支配の拡大を示します。"},{"q":"邪馬台国の所在をめぐる二大学説はどれですか？","choices":["関東説と九州説","北海道説と沖縄説","大和（近畿）説と九州説","東北説と四国説"],"ans":2,"exp":"邪馬台国の所在地については，奈良（大和）とする大和説と，北九州とする九州説が今も対立しています。"}],
  testQuiz:   [{"q":"「漢委奴国王」と刻まれた金印を授かったのはどこの王か？","choices":["邪馬台国","奴国","大和政権","倭の五王"],"ans":1},{"q":"金印が発見されたのはどこか？","choices":["奈良県","佐賀県","福岡県志賀島","大阪府"],"ans":2},{"q":"倭国大乱の後，女王として擁立されたのは誰か？","choices":["推古天皇","持統天皇","卑弥呼","神功皇后"],"ans":2},{"q":"卑弥呼が使用した呪術的支配の方法を何というか？","choices":["神道","仏道","鬼道","儒道"],"ans":2},{"q":"239年，魏が卑弥呼に与えた称号はどれか？","choices":["倭王","大和王","親魏倭王","漢委倭王"],"ans":2},{"q":"大和政権の「大王」とは何か？","choices":["最大の豪族連合の首長","天皇の別名","中国から来た王","仏教の指導者"],"ans":0},{"q":"前方後円墳の「後円部」は何のために使われたか？","choices":["祭礼の場","墓室","住居","会議の場"],"ans":1},{"q":"邪馬台国の所在地として対立する二説はどれか？","choices":["東北説と九州説","大和（近畿）説と九州説","四国説と関東説","北海道説と沖縄説"],"ans":1}]
};
let currentMode='flash';
let fcCards=[],fcIndex=0,fcOk=0,fcNg=0,fcFlipped=false;
let fcTimerSec=0,fcTimerCount=0,fcTimerInterval=null;
let drillQs=[],drillIndex=0,drillScore=0,drillAnswered=false;
let testSelections={},testSubmitted=false;

function selectMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-tab').forEach((t,i)=>{
    t.classList.toggle('active',['flash','drill','test'][i]===mode);
  });
  renderContent();
}
function renderContent(){
  const area=document.getElementById('content-area');
  if(currentMode==='flash') renderFlash(area);
  else if(currentMode==='drill') renderDrill(area);
  else renderTest(area);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fireConfetti(){
  const colors=['#8b3322','#c87000','#f4d03f','#2d8a30','#e8d5c8','#fff'];
  for(let i=0;i<80;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const size=8+Math.random()*10;
    el.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}vw;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.6}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}
function initFlash(){fcCards=shuffle([...UNIT.flashCards]);fcIndex=0;fcOk=0;fcNg=0;fcFlipped=false;}
function renderFlash(area){
  initFlash();
  area.innerHTML=`<div class="panel"><div class="fc-timer-row">
    <span style="font-size:13px;color:#888;margin-right:4px">⏱ 自動めくり：</span>
    <button class="fc-timer-btn${fcTimerSec===2?' active':''}" data-sec="2" onclick="setFcTimer(2)">2秒</button>
    <button class="fc-timer-btn${fcTimerSec===3?' active':''}" data-sec="3" onclick="setFcTimer(3)">3秒</button>
    <button class="fc-timer-btn${fcTimerSec===5?' active':''}" data-sec="5" onclick="setFcTimer(5)">5秒</button>
    <button class="fc-timer-btn${fcTimerSec===0?' active':''}" data-sec="0" onclick="setFcTimer(0)">手動</button>
  </div><div id="fc-wrap">${buildFlashCard()}</div></div>`;
  startCardTimer();
}
function buildFlashCard(){
  if(fcIndex>=fcCards.length){
    const total=fcCards.length,pct=Math.round(fcOk/total*100);
    clearInterval(fcTimerInterval);fcTimerInterval=null;
    if(pct===100)fireConfetti();
    return `<div class="fc-result" style="display:block">
      <div style="font-size:40px;font-weight:bold;color:#8b3322;margin-bottom:8px">${pct}%</div>
      <div class="fc-score-bar"><div class="fc-score-fill" style="width:${pct}%"></div></div>
      <p style="color:#555;margin:10px 0">正解 ${fcOk} / ${total}枚${pct===100?' 🎉 パーフェクト！':''}</p>
      <button class="fc-restart" onclick="renderFlash(document.getElementById('content-area'))">もう一度</button>
    </div>`;
  }
  const card=fcCards[fcIndex];
  return `<div class="fc-progress">📖 ${fcIndex+1} / ${fcCards.length}枚　✅ ${fcOk}　❌ ${fcNg}</div>
    <div class="fc-card" id="fc-card" onclick="flipCard()">
      <span id="fc-countdown" class="fc-countdown" style="display:none"></span>
      <div class="fc-front">${card.q}</div>
      <div class="fc-back">${card.a}</div>
      <div class="fc-hint">💡 ${card.hint}</div>
      <span class="tap-hint">タップして確認</span>
    </div>
    <div class="fc-btns" id="fc-btns" style="display:none">
      <button class="fc-btn-ok" onclick="fcAnswer(true)">✅ 正解</button>
      <button class="fc-btn-ng" onclick="fcAnswer(false)">❌ もう一度</button>
    </div>`;
}
function flipCard(){
  if(fcFlipped)return;
  fcFlipped=true;
  clearInterval(fcTimerInterval);fcTimerInterval=null;
  const card=document.getElementById('fc-card');
  if(card)card.classList.add('flipped');
  const cd=document.getElementById('fc-countdown');
  if(cd)cd.style.display='none';
  const btns=document.getElementById('fc-btns');
  if(btns)btns.style.display='flex';
}
function fcAnswer(ok){
  if(ok)fcOk++;else fcNg++;
  fcIndex++;fcFlipped=false;
  clearInterval(fcTimerInterval);fcTimerInterval=null;
  document.getElementById('fc-wrap').innerHTML=buildFlashCard();
  startCardTimer();
}
function setFcTimer(sec){
  fcTimerSec=sec;
  document.querySelectorAll('.fc-timer-btn').forEach(b=>{
    b.classList.toggle('active',parseInt(b.dataset.sec)===sec);
  });
  clearInterval(fcTimerInterval);fcTimerInterval=null;
  if(!fcFlipped)startCardTimer();
}
function startCardTimer(){
  clearInterval(fcTimerInterval);fcTimerInterval=null;
  if(fcTimerSec===0||fcFlipped)return;
  fcTimerCount=fcTimerSec;
  const cd=document.getElementById('fc-countdown');
  if(cd){cd.style.display='block';cd.textContent=fcTimerCount;}
  fcTimerInterval=setInterval(()=>{
    fcTimerCount--;
    const el=document.getElementById('fc-countdown');
    if(el)el.textContent=fcTimerCount>0?fcTimerCount:'';
    if(fcTimerCount<=0){clearInterval(fcTimerInterval);fcTimerInterval=null;flipCard();}
  },1000);
}
function renderDrill(area){
  drillQs=shuffle([...UNIT.drillQuiz]);drillIndex=0;drillScore=0;drillAnswered=false;
  area.innerHTML='<div class="panel" id="drill-panel">'+buildDrillQ()+'</div>';
}
function buildDrillQ(){
  if(drillIndex>=drillQs.length){
    const pct=Math.round(drillScore/drillQs.length*100);
    if(pct===100)fireConfetti();
    return `<div class="drill-result" style="display:block">
      <div class="drill-result-score">${drillScore} / ${drillQs.length}</div>
      <div class="drill-result-msg">${pct>=80?'🎉 よくできました！':pct>=60?'👍 もう少しです！':'📚 復習しましょう！'}</div>
      <button class="drill-restart-btn" onclick="renderDrill(document.getElementById('content-area'))">もう一度</button>
    </div>`;
  }
  const q=drillQs[drillIndex];
  const choices=q.choices.map((c,i)=>
    `<div class="drill-choice" onclick="drillAnswer(${i})">${['ア','イ','ウ','エ'][i]}．${c}</div>`
  ).join('');
  return `<div class="drill-prog">${drillIndex+1} / ${drillQs.length}問</div>
    <div class="drill-q-num">問題 ${drillIndex+1}</div>
    <div class="drill-q">${q.q}</div>
    <div class="drill-choices" id="drill-choices">${choices}</div>
    <div class="drill-exp" id="drill-exp"></div>
    <button class="drill-next-btn" id="drill-next" onclick="drillNext()">次の問題 →</button>`;
}
function drillAnswer(idx){
  if(drillAnswered)return;drillAnswered=true;
  const q=drillQs[drillIndex];
  document.querySelectorAll('.drill-choice').forEach((el,i)=>{
    if(i===q.ans)el.classList.add('correct');
    else if(i===idx&&i!==q.ans)el.classList.add('wrong');
    else el.classList.add('reveal');
  });
  if(idx===q.ans)drillScore++;
  const exp=document.getElementById('drill-exp');
  if(exp){exp.classList.add('show');exp.innerHTML=`<span class="exp-ans">✅ 正解：${q.choices[q.ans]}</span>${q.exp}`;}
  const next=document.getElementById('drill-next');
  if(next)next.style.display='inline-block';
}
function drillNext(){drillIndex++;drillAnswered=false;document.getElementById('drill-panel').innerHTML=buildDrillQ();}
function renderTest(area){
  testSelections={};testSubmitted=false;
  const qs=UNIT.testQuiz;
  const qHtml=qs.map((q,qi)=>{
    const cHtml=q.choices.map((c,ci)=>
      `<div class="test-choice" data-qi="${qi}" data-ci="${ci}" onclick="testSelect(${qi},${ci})">${['①','②','③','④'][ci]} ${c}</div>`
    ).join('');
    return `<div class="test-q-block">
      <div class="test-q"><span class="test-q-num">${qi+1}</span>${q.q}</div>
      <div class="test-choices" id="test-choices-${qi}">${cHtml}</div>
    </div>`;
  }).join('');
  area.innerHTML=`<div class="panel">
    <div class="test-header"><span class="test-title">📋 確認テスト（全${qs.length}問）</span></div>
    <div id="test-qs">${qHtml}</div>
    <button class="test-submit" onclick="testSubmit()">採点する</button>
    <div class="test-result-wrap" id="test-result"></div>
  </div>`;
}
function testSelect(qi,ci){
  if(testSubmitted)return;
  testSelections[qi]=ci;
  document.querySelectorAll(`[data-qi="${qi}"]`).forEach(el=>el.classList.remove('selected'));
  document.querySelector(`[data-qi="${qi}"][data-ci="${ci}"]`).classList.add('selected');
}
function testSubmit(){
  const qs=UNIT.testQuiz;
  const unanswered=qs.filter((_,i)=>testSelections[i]===undefined);
  if(unanswered.length>0){alert(`まだ${unanswered.length}問が未回答です。`);return;}
  testSubmitted=true;
  let score=0;const reviewItems=[];
  qs.forEach((q,qi)=>{
    const sel=testSelections[qi],correct=sel===q.ans;
    if(correct)score++;
    document.querySelectorAll(`[data-qi="${qi}"]`).forEach((el,ci)=>{
      if(ci===q.ans)el.classList.add('correct');
      else if(ci===sel)el.classList.add('wrong');
      else el.classList.add('reveal');
    });
    reviewItems.push({correct,q:q.q,ans:q.choices[q.ans]});
  });
  const pct=Math.round(score/qs.length*100);
  const badge=pct===100?'A 完璧！':pct>=75?'B よくできました':pct>=50?'C もう少し':'D 要復習';
  if(pct===100)fireConfetti();
  const reviewHtml=reviewItems.map((r,i)=>
    `<div class="test-review-item ${r.correct?'ok':'ng'}">
      <strong>${i+1}. ${r.correct?'✅':'❌'}</strong> ${r.q}
      ${!r.correct?`<br><span style="color:#c00">正解：${r.ans}</span>`:''}
    </div>`
  ).join('');
  document.querySelector('.test-submit').style.display='none';
  const res=document.getElementById('test-result');
  res.style.display='block';
  res.innerHTML=`<div class="test-result-score">${score} / ${qs.length}</div>
    <div class="test-result-sub">${pct}点</div>
    <div class="test-badge">${badge}</div><br>
    <button class="test-restart-btn" onclick="renderTest(document.getElementById('content-area'))">もう一度</button>
    <div class="test-review">${reviewHtml}</div>`;
  res.scrollIntoView({behavior:'smooth',block:'start'});
}
renderContent();
</script>
</body>
</html>
