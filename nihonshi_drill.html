<style>
  body{font-family:"Meiryo",sans-serif;max-width:900px;margin:20px auto;background:#fdf5ec;font-size:16px;padding-bottom:80px;line-height:1.8}
  h1{border-bottom:3px solid #8b3322;padding-bottom:8px;font-size:22px;color:#1a1a2e;margin-bottom:6px}

  .ch-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ch-tab{flex:1;min-width:110px;padding:10px 6px;border:none;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;background:#e8d5c8;color:#6a2318;transition:all 0.2s;line-height:1.4}
  .ch-tab.active{background:#8b3322;color:#fff;box-shadow:0 3px 0 #6a2318}

  /* ===== 単元サブタブ ===== */
  .sec-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .sec-tab{flex:1;min-width:120px;padding:8px 8px;border:2px solid #d4956a;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;background:#fff;color:#8b3322;transition:all 0.2s;line-height:1.4;text-align:center}
  .sec-tab.active{background:#c87000;color:#fff;border-color:#c87000;box-shadow:0 2px 0 #9a5800}
  .sec-tab:hover:not(.active){background:#fdebd0}

  /* ===== モードタブ ===== */
  .mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding-top:10px;border-top:1px solid #e0c8a0}
  .mode-tab{padding:9px 18px;border:2px solid #d4956a;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;background:#fff;color:#8b3322;transition:all 0.2s}
  .mode-tab.active{background:#8b3322;color:#fff;border-color:#8b3322}
  .mode-tab:hover:not(.active){background:#fdebd0}

  /* ===== セクション枠 ===== */
  .panel{background:#fff;border-radius:10px;border:1px solid #d4956a;padding:20px;margin-bottom:14px}
  .ch-desc{background:#fff8f0;border-left:4px solid #8b3322;padding:10px 16px;border-radius:0 8px 8px 0;margin-bottom:14px;font-size:14px;color:#555;line-height:1.8}
  .stat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .stat-chip{background:#8b3322;color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:bold}
  .stat-chip.green{background:#1a6b22}
  .stat-chip.blue{background:#1a4f7a}
  .stat-chip.orange{background:#c87000}

  /* ===== フラッシュカード ===== */
  .fc-progress{font-size:13px;color:#888;margin-bottom:10px}
  .fc-card{background:linear-gradient(135deg,#fffbf0,#fde8c0);color:#1a1a2e;border:2px solid #f0c880;border-radius:16px;padding:32px 28px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;margin-bottom:14px;position:relative;box-shadow:0 4px 16px rgba(200,112,0,0.15)}
  .fc-card .fc-front{font-size:18px;line-height:1.8;font-weight:bold;color:#1a1a2e}
  .fc-card .fc-back{display:none;font-size:24px;font-weight:bold;color:#8b3322}
  .fc-card .fc-hint{font-size:13px;color:#6a4f00;margin-top:8px;display:none;background:rgba(255,255,255,0.6);border-radius:8px;padding:4px 10px}
  .fc-card.flipped{background:linear-gradient(135deg,#f0fff4,#d0f0d8);border-color:#6aab72}
  .fc-card.flipped .fc-front{display:none}
  .fc-card.flipped .fc-back{display:block}
  .fc-card.flipped .fc-hint{display:block}
  .fc-card .tap-hint{font-size:12px;color:#b08040;position:absolute;bottom:12px;right:16px}
  .fc-countdown{position:absolute;top:12px;right:16px;font-size:26px;font-weight:bold;color:#c87000;opacity:0.7;line-height:1;min-width:28px;text-align:center}
  .fc-timer-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .fc-timer-btn{padding:6px 16px;border:2px solid #d4956a;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer;background:#fff;color:#8b3322;transition:all 0.15s}
  .fc-timer-btn.active{background:#8b3322;color:#fff;border-color:#8b3322}
  .fc-timer-btn:hover:not(.active){background:#fdebd0}
  .fc-btns{display:flex;gap:10px;margin-bottom:18px;justify-content:center}
  .fc-btn-ok{padding:10px 28px;background:#1a6b22;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #0d4f15}
  .fc-btn-ng{padding:10px 28px;background:#8b3322;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318}
  .fc-score-bar{background:#eee;border-radius:20px;height:12px;margin:10px 0;overflow:hidden}
  .fc-score-fill{height:100%;background:linear-gradient(90deg,#1a6b22,#2d8a30);border-radius:20px;transition:width 0.4s}
  .fc-result{background:#fff3e0;border:2px solid #d4956a;border-radius:10px;padding:16px;text-align:center;font-size:15px;display:none}
  .fc-restart{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:10px}

  /* ===== 4択ドリル ===== */
  .drill-q-num{font-size:12px;color:#888;margin-bottom:6px}
  .drill-q{font-size:17px;font-weight:bold;color:#1a1a2e;margin-bottom:14px;line-height:1.7}
  .drill-choices{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
  .drill-choice{padding:11px 16px;border-radius:9px;border:1.5px solid #d4956a;background:#fdf5ec;cursor:pointer;font-size:15px;line-height:1.6;transition:all 0.15s}
  .drill-choice:hover{border-color:#8b3322;background:#fdebd0}
  .drill-choice.correct{background:#d0f0d8;border-color:#1a6b22;color:#1a4015;pointer-events:none;font-weight:bold}
  .drill-choice.wrong{background:#fdd;border-color:#c00;color:#800;pointer-events:none}
  .drill-choice.reveal{background:#fdebd0;border-color:#c87000;pointer-events:none}
  .drill-exp{background:#1a1a2e;color:#f0f0f0;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.8;margin-bottom:12px;display:none}
  .drill-exp.show{display:block}
  .drill-exp .exp-ans{color:#f4d03f;font-weight:bold;display:block;margin-bottom:4px}
  .drill-next-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 26px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318;display:none}
  .drill-result{text-align:center;padding:24px;display:none}
  .drill-result-score{font-size:40px;font-weight:bold;color:#8b3322;margin-bottom:8px}
  .drill-result-msg{font-size:16px;color:#555;margin-bottom:16px}
  .drill-restart-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 26px;font-size:15px;font-weight:bold;cursor:pointer}
  .drill-prog{font-size:13px;color:#888;text-align:right;margin-bottom:8px}

  /* ===== 確認テスト ===== */
  .test-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .test-title{font-size:17px;font-weight:bold;color:#8b3322}
  .test-timer{font-size:14px;color:#555;font-weight:bold}
  .test-q-block{border-bottom:1px solid #eee;padding:16px 0}
  .test-q-block:last-child{border-bottom:none}
  .test-q{font-size:15px;font-weight:bold;color:#1a1a2e;margin-bottom:10px;line-height:1.7}
  .test-q-num{display:inline-block;background:#8b3322;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:13px;font-weight:bold;margin-right:8px}
  .test-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  @media(max-width:560px){.test-choices{grid-template-columns:1fr}}
  .test-choice{padding:9px 12px;border-radius:8px;border:1.5px solid #d4956a;background:#fdf5ec;cursor:pointer;font-size:14px;transition:all 0.15s}
  .test-choice:hover{border-color:#8b3322;background:#fdebd0}
  .test-choice.selected{border-color:#1a4f7a;background:#e0f0ff;color:#1a4f7a;font-weight:bold}
  .test-choice.correct{background:#d0f0d8;border-color:#1a6b22;color:#1a4015;font-weight:bold;pointer-events:none}
  .test-choice.wrong{background:#fdd;border-color:#c00;color:#800;pointer-events:none}
  .test-choice.reveal{background:#fdebd0;border-color:#c87000;pointer-events:none}
  .test-submit{background:#8b3322;color:#fff;border:none;border-radius:10px;padding:13px 36px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #6a2318;margin-top:18px;width:100%}
  .test-submit:hover{background:#6a2318}
  .test-result-wrap{display:none;text-align:center;padding:30px 0}
  .test-result-score{font-size:52px;font-weight:bold;color:#8b3322;line-height:1.2}
  .test-result-sub{font-size:16px;color:#555;margin:8px 0 18px}
  .test-badge{display:inline-block;background:linear-gradient(135deg,#c87000,#f4a261);color:#fff;border-radius:12px;padding:8px 20px;font-size:15px;font-weight:bold;margin-bottom:14px}
  .test-restart-btn{background:#8b3322;color:#fff;border:none;border-radius:8px;padding:10px 28px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 2px 0 #6a2318}
  .test-review{margin-top:20px;text-align:left}
  .test-review-item{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:14px;line-height:1.7}
  .test-review-item.ok{background:#d0f0d8;border-left:4px solid #1a6b22}
  .test-review-item.ng{background:#fdd;border-left:4px solid #c00}
  .test-review-label{font-weight:bold;margin-right:6px}

  .confetti-piece{position:fixed;top:-20px;border-radius:3px;animation:confettiFall linear forwards;z-index:9999;pointer-events:none}
  @keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>

// =========================================================
//  状態変数
// =========================================================
let currentChapter = 1;
let currentSec = 0;
let currentMode = 'flash';

// フラッシュカード状態
let fcCards = [];
let fcIndex = 0;
let fcOk = 0;
let fcNg = 0;
let fcFlipped = false;
let fcTimerSec = 0;
let fcTimerCount = 0;
let fcTimerInterval = null;

// 4択ドリル状態
let drillQs = [];
let drillIndex = 0;
let drillScore = 0;
let drillAnswered = false;

// 確認テスト状態
let testSelections = {};
let testSubmitted = false;

// =========================================================
//  章・単元・モード切り替え
// =========================================================
function selectChapter(ch) {
  currentChapter = ch;
  currentSec = 0;
  document.querySelectorAll('.ch-tab').forEach((t,i) => t.classList.toggle('active', i === ch-1));
  renderSecTabs();
  renderContent();
}

function selectSec(i) {
  currentSec = i;
  document.querySelectorAll('.sec-tab').forEach((t,j) => t.classList.toggle('active', j === i));
  renderContent();
}

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t,i) => {
    t.classList.toggle('active', ['flash','drill','test'][i] === mode);
  });
  renderContent();
}

function renderSecTabs() {
  const secs = allData[currentChapter].sections;
  const html = secs.map((s,i) =>
    `<button class="sec-tab${i===currentSec?' active':''}" onclick="selectSec(${i})">${s.shortTitle}</button>`
  ).join('');
  document.getElementById('sec-tabs').innerHTML = html;
}

// =========================================================
//  メインレンダラー
// =========================================================
function renderContent() {
  const sec = allData[currentChapter].sections[currentSec];
  const area = document.getElementById('content-area');
  const descHtml = `
    <div class="ch-desc">
      <strong>${sec.title}</strong>
      <div class="stat-bar">
        <span class="stat-chip blue">カード ${sec.flashCards.length}枚</span>
        <span class="stat-chip orange">ドリル ${sec.drillQuiz.length}問</span>
        <span class="stat-chip green">テスト ${sec.testQuiz.length}問</span>
      </div>
    </div>`;
  if (currentMode === 'flash') renderFlash(sec, area, descHtml);
  else if (currentMode === 'drill') renderDrill(sec, area, descHtml);
  else renderTest(sec, area, descHtml);
}

// =========================================================
//  フラッシュカード
// =========================================================
function initFlash(sec) {
  fcCards = shuffle([...sec.flashCards]);
  fcIndex = 0; fcOk = 0; fcNg = 0; fcFlipped = false;
}

function renderFlash(sec, area, descHtml) {
  initFlash(sec);
  area.innerHTML = descHtml + `
  <div class="fc-timer-row">
    <span style="font-size:13px;color:#888;margin-right:4px">⏱ 自動めくり：</span>
    <button class="fc-timer-btn${fcTimerSec===2?' active':''}" data-sec="2" onclick="setFcTimer(2)">2秒</button>
    <button class="fc-timer-btn${fcTimerSec===3?' active':''}" data-sec="3" onclick="setFcTimer(3)">3秒</button>
    <button class="fc-timer-btn${fcTimerSec===5?' active':''}" data-sec="5" onclick="setFcTimer(5)">5秒</button>
    <button class="fc-timer-btn${fcTimerSec===0?' active':''}" data-sec="0" onclick="setFcTimer(0)">手動</button>
  </div>
  <div class="panel">
    <div id="fc-wrap">${buildFlashCard()}</div>
  </div>`;
  startCardTimer();
}

function buildFlashCard() {
  if (fcIndex >= fcCards.length) {
    const total = fcCards.length;
    const pct = Math.round(fcOk / total * 100);
    return `
      <div class="fc-result" style="display:block">
        <div style="font-size:36px;font-weight:bold;color:#8b3322;margin-bottom:8px">${pct}%</div>
        <div style="font-size:15px;color:#555;margin-bottom:4px">${total}枚中 ○${fcOk}枚 / △${fcNg}枚</div>
        <div style="font-size:14px;color:#888;margin-bottom:14px">
          ${pct>=80?'🎉 よくできました！':pct>=60?'👍 もう一度チャレンジしてみましょう！':'📖 教材を見直してから再挑戦してみましょう！'}
        </div>
        <button class="fc-restart" onclick="restartFlash()">🔄 もう一度</button>
      </div>`;
  }
  const card = fcCards[fcIndex];
  return `
    <div class="fc-progress">${fcIndex+1} / ${fcCards.length} &nbsp; ○ ${fcOk} &nbsp; △ ${fcNg}</div>
    <div class="fc-score-bar"><div class="fc-score-fill" style="width:${fcOk/fcCards.length*100}%"></div></div>
    <div class="fc-card" id="fc-card" onclick="flipCard()">
      <span class="fc-countdown" id="fc-countdown" style="display:${fcTimerSec>0?'block':'none'}">${fcTimerSec>0?fcTimerSec:''}</span>
      <div class="fc-front">${card.q}</div>
      <div class="fc-back">${card.a}</div>
      <div class="fc-hint">${card.hint||''}</div>
      <span class="tap-hint">${fcTimerSec>0?'':'タップして答えを見る'}</span>
    </div>
    <div class="fc-btns" id="fc-btns" style="display:none">
      <button class="fc-btn-ok" onclick="fcAnswer(true)">○ わかった</button>
      <button class="fc-btn-ng" onclick="fcAnswer(false)">△ もう一度</button>
    </div>`;
}

function flipCard() {
  if (fcFlipped) return;
  clearInterval(fcTimerInterval); fcTimerInterval = null;
  fcFlipped = true;
  document.getElementById('fc-card').classList.add('flipped');
  const cd = document.getElementById('fc-countdown');
  if (cd) cd.style.display = 'none';
  document.getElementById('fc-btns').style.display = 'flex';
}

function fcAnswer(ok) {
  clearInterval(fcTimerInterval); fcTimerInterval = null;
  if (ok) fcOk++; else fcNg++;
  fcIndex++;
  fcFlipped = false;
  document.getElementById('fc-wrap').innerHTML = buildFlashCard();
  if (fcIndex >= fcCards.length && fcOk === fcCards.length) launchConfetti();
  else startCardTimer();
}

function restartFlash() {
  clearInterval(fcTimerInterval); fcTimerInterval = null;
  const sec = allData[currentChapter].sections[currentSec];
  initFlash(sec);
  document.getElementById('fc-wrap').innerHTML = buildFlashCard();
  startCardTimer();
}

function setFcTimer(sec) {
  fcTimerSec = sec;
  document.querySelectorAll('.fc-timer-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.sec) === sec);
  });
  clearInterval(fcTimerInterval); fcTimerInterval = null;
  if (!fcFlipped) startCardTimer();
}

function startCardTimer() {
  clearInterval(fcTimerInterval); fcTimerInterval = null;
  if (fcTimerSec === 0 || fcFlipped) return;
  fcTimerCount = fcTimerSec;
  const cd = document.getElementById('fc-countdown');
  if (cd) { cd.style.display = 'block'; cd.textContent = fcTimerCount; }
  fcTimerInterval = setInterval(() => {
    fcTimerCount--;
    const el = document.getElementById('fc-countdown');
    if (el) el.textContent = fcTimerCount > 0 ? fcTimerCount : '';
    if (fcTimerCount <= 0) {
      clearInterval(fcTimerInterval); fcTimerInterval = null;
      flipCard();
    }
  }, 1000);
}

// =========================================================
//  4択ドリル
// =========================================================
function renderDrill(sec, area, descHtml) {
  drillQs = shuffle([...sec.drillQuiz]);
  drillIndex = 0; drillScore = 0; drillAnswered = false;
  area.innerHTML = descHtml + `<div class="panel" id="drill-panel">${buildDrillQ()}</div>`;
}

function buildDrillQ() {
  if (drillIndex >= drillQs.length) {
    return `<div class="drill-result" style="display:block">
      <div class="drill-result-score">${drillScore} / ${drillQs.length}</div>
      <div class="drill-result-msg">${drillScore===drillQs.length?'🎉 全問正解！':'👍 お疲れさまでした！もう一度挑戦してみましょう。'}</div>
      <button class="drill-restart-btn" onclick="renderDrill(allData[currentChapter].sections[currentSec],document.getElementById('content-area'),'')">🔄 もう一度</button>
    </div>`;
  }
  const q = drillQs[drillIndex];
  const choicesHtml = q.choices.map((c,i) =>
    `<div class="drill-choice" onclick="drillSelect(this,${i},${q.ans})">${i+1}．${c}</div>`
  ).join('');
  return `
    <div class="drill-prog">第 ${drillIndex+1} 問 / 全 ${drillQs.length} 問</div>
    <div class="drill-q">${q.q}</div>
    <div class="drill-choices">${choicesHtml}</div>
    <div class="drill-exp" id="drill-exp"></div>
    <button class="drill-next-btn" id="drill-next" onclick="drillNext()">次の問題 →</button>`;
}

function drillSelect(el, ci, ans) {
  if (drillAnswered) return;
  drillAnswered = true;
  const q = drillQs[drillIndex];
  document.querySelectorAll('.drill-choice').forEach((c,i) => {
    if (i === ans) c.classList.add('correct');
    else if (i === ci && ci !== ans) c.classList.add('wrong');
    else c.classList.add('reveal');
  });
  if (ci === ans) drillScore++;
  const exp = document.getElementById('drill-exp');
  exp.innerHTML = `<span class="exp-ans">答え：${q.choices[ans]}</span>${q.exp}`;
  exp.classList.add('show');
  document.getElementById('drill-next').style.display = 'inline-block';
}

function drillNext() {
  drillIndex++;
  drillAnswered = false;
  document.getElementById('drill-panel').innerHTML = buildDrillQ();
  if (drillIndex >= drillQs.length && drillScore === drillQs.length) launchConfetti();
}

// =========================================================
//  確認テスト
// =========================================================
let testTimer = null;
let testTimerLeft = 0;

function renderTest(sec, area, descHtml) {
  testSelections = {};
  testSubmitted = false;
  clearInterval(testTimer);
  testTimerLeft = sec.testQuiz.length * 40;
  const qs = sec.testQuiz;
  const qsHtml = qs.map((q,qi) => `
    <div class="test-q-block">
      <div class="test-q"><span class="test-q-num">${qi+1}</span>${q.q}</div>
      <div class="test-choices">
        ${q.choices.map((c,ci)=>`<div class="test-choice" id="tc-${qi}-${ci}" onclick="testSelect(${qi},${ci})">${['ア','イ','ウ','エ'][ci]}．${c}</div>`).join('')}
      </div>
    </div>`).join('');
  area.innerHTML = descHtml + `
    <div class="panel">
      <div class="test-header">
        <div class="test-title">📋 確認テスト（${qs.length}問）</div>
        <div class="test-timer" id="test-timer">残り <span id="timer-val">${fmtTime(testTimerLeft)}</span></div>
      </div>
      <div id="test-questions">${qsHtml}</div>
      <button class="test-submit" onclick="testSubmit()">採点する</button>
    </div>
    <div class="test-result-wrap" id="test-result"></div>`;
  testTimer = setInterval(() => {
    testTimerLeft--;
    const el = document.getElementById('timer-val');
    if (el) el.textContent = fmtTime(testTimerLeft);
    if (testTimerLeft <= 0) { clearInterval(testTimer); testSubmit(); }
  }, 1000);
}

function fmtTime(s) {
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function testSelect(qi, ci) {
  if (testSubmitted) return;
  const sec = allData[currentChapter].sections[currentSec];
  const total = sec.testQuiz.length;
  for (let k=0; k<4; k++) {
    const el = document.getElementById(`tc-${qi}-${k}`);
    if (el) el.classList.remove('selected');
  }
  const el = document.getElementById(`tc-${qi}-${ci}`);
  if (el) el.classList.add('selected');
  testSelections[qi] = ci;
}

function testSubmit() {
  if (testSubmitted) return;
  testSubmitted = true;
  clearInterval(testTimer);
  const sec = allData[currentChapter].sections[currentSec];
  const qs = sec.testQuiz;
  let score = 0;
  qs.forEach((q,qi) => {
    const sel = testSelections[qi];
    for (let k=0; k<q.choices.length; k++) {
      const el = document.getElementById(`tc-${qi}-${k}`);
      if (!el) return;
      el.classList.remove('selected');
      if (k === q.ans) el.classList.add('correct');
      else if (k === sel && sel !== q.ans) el.classList.add('wrong');
      else el.classList.add('reveal');
    }
    if (sel === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  const pass = pct >= 70;
  const reviewHtml = qs.map((q,qi) => {
    const ok = testSelections[qi] === q.ans;
    return `<div class="test-review-item ${ok?'ok':'ng'}">
      <span class="test-review-label">${ok?'✅':'❌'} 第${qi+1}問</span>${q.q}<br>
      <span style="font-size:13px">正解：${q.choices[q.ans]}${!ok&&testSelections[qi]!==undefined?' ／ あなたの答え：'+q.choices[testSelections[qi]]:!ok?' ／ 未解答':''}</span>
    </div>`;
  }).join('');
  const resultEl = document.getElementById('test-result');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div class="test-result-score">${score}<span style="font-size:24px"> / ${qs.length}</span></div>
    <div class="test-result-sub">${pct}点 — ${pass?'合格🎉':'もう一度頑張ろう！'}</div>
    <div class="test-badge">${pass?'✨ 合格（70点以上）':'📖 不合格（70点未満）'}</div><br>
    <button class="test-restart-btn" onclick="renderTest(allData[currentChapter].sections[currentSec],document.getElementById('content-area'),'')">🔄 もう一度挑戦</button>
    <div class="test-review" style="margin-top:20px">${reviewHtml}</div>`;
  resultEl.scrollIntoView({behavior:'smooth'});
  if (score === qs.length) launchConfetti();
}

// =========================================================
//  ユーティリティ
// =========================================================
function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function launchConfetti() {
  const colors=['#f4d03f','#e74c3c','#3498db','#2ecc71','#9b59b6','#f39c12'];
  for(let i=0;i<80;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.5}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

// =========================================================
//  初期化
// =========================================================
renderSecTabs();
renderContent();
</script>
